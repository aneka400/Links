<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 24px;
            color: #1a1a1a;
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            font-size: 16px;
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus { border-color: #007bff; }

        .errorlist {
            list-style: none;
            color: #dc3545;
            font-size: 14px;
            margin-top: 6px;
        }

        button {
            margin-top: 16px;
            width: 100%;
            padding: 11px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: #0056b3; }

        .greeting {
            margin-top: 20px;
            padding: 14px 18px;
            background: #d4edda;
            border-radius: 8px;
            color: #155724;
            font-size: 18px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Введите ваше имя</h1>

        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.name }}
            {% if form.name.errors %}
                <ul class="errorlist">
                    {% for error in form.name.errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
            <button type="submit">Отправить</button>
        </form>

        {% if greeting %}
            <div class="greeting">{{ greeting }}</div>
        {% endif %}
    </div>
</body>
</html>
