<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Привественное приложение</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0.4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .submit-btn {
            background-color: #4caf50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 85px;
        }
        .submit-btn:hover {
            background-color: #45a049;
        }
        .greeting {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #4caf50;
        }
        .error {
            color: #ff4d4f;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Представьтесь пожалуйста</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.name }}
        <button type="submit">Отправить</button>
    </form>

    {% if greeting %}
        <div class="greeting-message">
            {{ greeting }}
        </div>
    {% endif %}
</div>
</body>
</html>
